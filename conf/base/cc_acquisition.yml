# cc_acquisition: the walking skeleton's use case on the synthetic dev dataset (Stage 1).
# Every option is explained in TEMPLATE.yml. `null` = the automation level's default (D-023).
schema_version: 1
task: binary
use_case: cc_acquisition                 # <product>_<activity> (D-128)
domain: retail
automation_level: assisted               # autonomous | assisted

decision:                                # declared before any result; never changed later (§4.3)
  type: probability                      # scores compared across products (D-049)
  n: null
  metric: null                           # derived from the decision type
  gate_metric: null
  baselines: [population_base_rate]

entities:                                # only the entities this use case applies to (D-034)
  entity_a:
    sources:
      features: [retail_mart]            # ordered: the first is the governing spine
      # features: [feature_store]        # the feature store, alone (not implemented until OD-26)
      # features: [feature_store, retail_mart]   # the feature store as the spine, the mart joined
      targets: retail_holdings           # left-joined to the spine; contributes only the target

data:
  keys: {unit_id: client_id, period: snapshot_month}   # renamed to unit_id, period; id as string
  # the saved model input's logical name; one table may serve several use cases that share the
  # sources, keys and period (run a.yml b.yml --stages target_factory); eligibility, candidates,
  # contract and split are derived on read, so they may change without a rebuild (D-131)
  model_input: cc_acquisition_input
  eligibility:                           # two ordered Spark SQL lists; filters log rows in -> out
    analysis:                            # rows dropped before EDA
      - {name: has_income, define: "income IS NOT NULL"}
      - {name: income_known_or_salaried, filter: "has_income OR salary_transfer_flag = 1",
         reason: "card rules need a known income"}
    modelling:                           # kept for EDA, tagged 0/1; dropped before Feature Checks
      - {name: non_holders, filter: "cc_flag = 0",
         reason: "acquisition is scored for clients without a card"}
  target:
    rule: flag_goes_up                   # the flag is 1 in some period of t+1 … t+w and 0 at t
    column: cc_flag                      # excluded from the candidates (lineage)
  split: {test_share: 0.3, seed: 42}     # by client, seeded hash; applied from Training on
  rate_band: {max: 0.5}                  # contract check on the true population

time:
  period: month                          # the unit of analysis: month | week | day; a monthly mart
  # a month is written as its first or its last day and held as its last
  observation_window: {first: 2025-03-01, last: 2025-08-01}   # t1 … tk: six months
  target_window: 3                       # w: periods t+1 … t+w
  validation_period: 2025-11-01          # v >= tk + w by period index; sources reach v + w

features:
  candidates: {include: ["*"], exclude: []}   # glob patterns over the feature sources' columns

strata:
  variables: [segment, onboarding_channel]
  max_levels: 10
  min_events: 50

eda:
  key_features: {top_n: null, include: []}   # top-N by univariate ranking plus the listed ones
  chart_sample_share: null

feature_checks:
  steps:                                 # ordered; each flags and logs, never drops
    - {name: quality, params: {}}
    - {name: leakage, params: {}}
    - {name: time_alignment, params: {}}
    - {name: eligibility_constant, params: {}}
    - {name: stability, params: {psi_max: 0.25}}
    - {name: redundancy, params: {}}

training:
  path: automl
  estimator_list: [lgbm, xgboost, catboost]
  max_iter: null                         # the trial budget: a rerun gives the same model
  time_budget_s: null
  seed: 42
  search_space: {}
  selection: {univariate_floor: 0.515, importance_floor: null}
  categoricals: {min_level_count: 50}
  calibration: {method: platt}           # on for probability decisions (D-049)
  sampling: null                         # the synthetic dev target is not rare

evaluation:
  slices: {top_pct: [0.01, 0.10], top_n: [10000]}
  views: []

lifecycle:
  promotion_gate: {min: null}            # set when the lifecycle stage is built

inference:
  model: production

monitoring:
  drift: {psi_max: 0.25}
  outcome_join: true
  retrain_policy: {max_age_months: null, psi_flags: null}
