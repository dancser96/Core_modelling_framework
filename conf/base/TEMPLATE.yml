# Use-case config template: copy to <use_case>.yml and fill it in. Unknown keys fail at load.
# Design and every field's description: docs/components/config.md.
# How to read a line:
#   `# required`        no default: the line must stay; fill the <angle brackets>, a plain value
#                       is the common choice
#   a plain value       the default: deleting the line gives exactly this value
#   null · level: …     the automation level fills it; the comment names both levels' values
#                       (D-132); for a key inside {…}, the comment names the key first
#   any other null      off, or derived as the comment says
#   # key: …            a commented-out alternative to the line above it
# A short comment sits on the line it explains; a longer one sits right above its key; a
# `null · level` line always names both values on its own line. The resolved config records
# every value a run used, defaults included.
schema_version: 1                        # required · the schema version; older files migrate
task: binary                             # required · binary (0/1 outcome) | regression (amount)
use_case: <use_case>   # required · letters, digits, _ and -; names folders and target_<use_case>
domain: <domain>                         # required · retail | sme | corporate; a label, not code
# autonomous: rules decide, a first model fast | assisted: a person reviews each stage
automation_level: assisted               # required

decision:                                # required · set before any result, never changed (§4.3)
  # how the scores are used: top_n: a fixed-size list | threshold: act above a cut | ranking:
  # order only | probability: a calibrated score, comparable across products (D-049)
  type: probability                      # required
  n: null                                # top_n only, and required there: the list size
  metric: null                           # null: derived from the type; else a FLAML name (T9)
  gate_metric: null                      # null: derived from the type; the promotion gate's metric
  # add previous_model (a successor model), historic_predicted_rate (a rate already in use)
  baselines: [population_base_rate]

# only the entities this use case applies to; data is never merged across them (D-034)
entities:                                # required
  <entity>:
    sources:                             # required
      # an ORDERED list of logical names: the first is the governing spine (its rows are the
      # panel), the rest are left-joined to it on the keys; a duplicate key in any source fails.
      # A source column named unit_id, period, target, split or eligible is read as
      # source_ + its name (source_target); name it so in the config (data.target.column names an
      # upstream target as is)
      # A source whose key columns are named otherwise than data.keys is written as
      # {source: <feature_source>, keys: {unit_id: <unit_id_column>, period: <period_column>}} with
      # its own column names; a key left out is named as in data.keys. The spine (the first) is
      # always a plain name. The same form works for targets.
      features: [<feature_source>]       # required
      # features: [feature_store]        # the feature store alone (not implemented until OD-26)
      # features: [feature_store, <feature_source>]   # the feature store as the spine
      targets: null                      # null: the target is a column of a feature source
      # targets: <target_source>         # a source left-joined to the spine for the target only

data:                                    # required
  # the spine's key columns, and those of every source that names none of its own; renamed to
  # unit_id and period at load, the id cast to string (so the client split survives a change of
  # the id's type)
  keys: {unit_id: <unit_id_column>, period: <period_column>}   # required
  model_input: null                      # null: the frames are built in memory on every run
  # saved once by Target Factory; every later stage reads it; saving freezes the config's data
  # part (sources, keys, period, target). One table may serve several use cases that share the
  # sources, keys and period: `run a.yml b.yml --stages target_factory`. Eligibility, the
  # candidates, the contract checks and the split are derived on read, so they may change
  # without a rebuild (D-131):
  # model_input: <use_case>_input
  # two ordered lists of Spark SQL steps; a define names a condition for the steps after it, a
  # filter keeps rows and says why. Who the analysis sees: an `analysis` filter drops its rows
  # before EDA. Who the model sees: a `modelling` filter keeps its rows for EDA, tagged 0/1 by
  # the step's name (a reference group, e.g. current holders), and drops them before Feature
  # Checks. A null condition counts as false.
  eligibility:
    analysis: []                         # []: every row of the spine reaches EDA
    # analysis:
    #   - {name: has_income, define: "income IS NOT NULL"}
    #   - {name: income_known, filter: "has_income OR salary_transfer_flag = 1",
    #      reason: "card rules need a known income"}
    modelling: []                        # []: every row that reaches EDA is modelled
    # modelling:
    #   - {name: <step_name>, filter: "<spark_sql>", reason: "<reason>"}
  target:                                # required
    # the upstream target, or the column a rule reads; excluded from the candidates
    column: <target_column>              # required
    # null: `column` is an upstream target, used as is. flag_goes_up: the flag is 1 in some
    # period of t+1 … t+w and 0 at t (acquisition, activation); a null in the column is never an
    # event and gives a null target when nothing can be compared, so fill nulls that mean a
    # value upstream. The count and amount rules come later
    rule: null
    lineage: []                          # upstream only: the columns it was built from, excluded
  split: {test_share: 0.3, seed: 42}     # the client split, a seeded hash; smaller for few clients
  rate_band: {max: 0.5}                  # the target rate's ceiling; above it the data is suspect

time:                                    # required
  # the unit of analysis, one row per unit per period. month: the usual grain of a feature mart
  # and of slow outcomes (acquisition, churn) | week: campaign or activity outcomes on weekly
  # data | day: daily data and fast outcomes. The sources must carry one row per unit per period
  period: month
  # every date below is written as a day of its period (a month: its first or its last day, any
  # other day is refused as a typo; a week: any of its days; a day: itself) and held as its last
  # the observation window t1 … tk: the periods the model trains on; 6 periods is the usual start
  observation_window: {first: <first_period>, last: <last_period>}   # required
  target_window: 3                       # required · w: periods t+1 … t+w; more for slow outcomes
  # the out-of-time period the model is judged on, at least w periods after the window's last so
  # no target window overlaps; the sources must reach w periods beyond it (matured labels).
  # null: an EDA-only config (EDA and Feature Checks run, Training refuses until it is set)
  validation_period: <validation_period> # required

features:
  # glob patterns over the feature sources' columns; exclude known non-features
  candidates: {include: ["*"], exclude: []}
  # a candidate's kind over the Spark-schema default (numbers numeric; strings and booleans
  # categorical): a numeric code such as a branch or product code is categorical, a number stored
  # as a string numeric. A key naming no candidate fails; e.g. {branch_code: categorical}
  kinds: {}

strata:                                  # required · reported by every stage (D-038)
  variables: [<strata_variable>]         # required · categorical columns for metrics and drift
  max_levels: 10                         # rarer levels are pooled as other
  min_events: 50                         # fewer positives in a stratum: shown as insufficient

eda:
  # the one period EDA analyses whole, every client after the analysis filters (D-135). last: the
  # window's last period, the closest to scoring | a period inside the window, e.g. one before a
  # known disruption. A period with fewer clients changes every snapshot statistic
  snapshot: last
  # quantile bins per numeric for every statistic over the window's periods; a value on at least
  # 1/bins of the rows (0, a dominant value) is its own bin. null: every value its own bin and every
  # statistic exact, for small populations (a subsegment, SME, corporate); refused above 50 million
  # cells
  bins: 100
  key_features:                          # the deep dives: the ranking's top-N plus the listed ones
    top_n: 10                            # how many from the ranking; 0: only the listed ones
    include: []                          # candidates always deep-dived, e.g. a business driver
    # a candidate associated above this with a key feature already chosen is skipped and shown as
    # represented by it; lower it for more variety, 1 skips none
    max_correlation: 0.9

# Feature Checks: five steps, always in this order. A step left out of this mapping is not run;
# the section left out runs all five with these defaults. A flag holds its feature out of training
# until a person records keep or exclude; a note only informs (D-134). A concordance is a feature's
# ranking power in its own direction: 0.5 none, 1 perfect. After the config freezes, a value
# changes through a set entry in the audit log
feature_checks:
  quality:
    dominant_share_max: 0.99             # flag near_constant: one value (null too) on this share
    missing_share_max: 0.95              # flag high_missing: at least this share of nulls
    max_levels: 50                       # flag high_cardinality: more levels (codes, free text?)
    # note: many nulls and never a zero, so a null may mean 0; fill it upstream, never impute here
    nulls_may_be_zeros:
      missing_min: 0.2                   # the null share from which the note looks
      zero_share_max: 0.005              # "never a zero": at most this share of zeros among values
    nulls_informative_min: 0.55          # note: whether it is filled ranks the target this well
  leakage:
    # flag too_strong: one feature this strong is usually the target under another name; with every
    # feature the synthetic card target's best possible model reaches 0.84. Raise it only for a
    # target a single field is known to predict
    concordance_max: 0.80
    null_concordance_max: 0.70           # flag: whether it is filled predicts this well (ask how)
    # flag rare_value_leak: beside a dominant value, the others' rate (mean) this far above its,
    # as Cohen's h (binary) or d (regression): 0.2 small, 0.5 medium, 0.8 large
    rare_effect_max: 0.8
    dominant_share_min: 0.90             # one value on this share of filled rows: the rest is rare
  time_alignment:                        # both flags look only at features with concordance_min+
    signal_kept_min: 0.5                 # flag: keeps under this share of its signal once lagged
    constant_clients_min: 0.99           # flag: this share of clients constant, and predictive
    concordance_min: 0.6                 # the signal a feature needs before either flag looks
  stability:
    psi_note_min: 0.10                   # note from this PSI: window first → last, or last → latest
    psi_max: 0.25                        # flag: from this PSI the feature is held (Monitoring's
                                         # drift threshold)
    # flag concordance_unstable: power differs across the window's periods, when Cochran's p is at
    # most heterogeneity_p_max and the concordance's range at least concordance_range_min × the
    # signal (concordance_window − 0.5; 0.5: half the signal), which stops a large population from
    # flagging every wobble; never below concordance_range_floor, so a feature with no signal
    # needs a real swing
    heterogeneity_p_max: 0.01
    concordance_range_min: 0.5
    concordance_range_floor: 0.05
    new_level_share_max: 0.01            # note: unseen levels on this share of the latest rows
  redundancy:                            # notes, shown as clusters; a person decides what to keep
    correlation_max: 0.90                # |Spearman| of a numeric pair; also the cluster cut
    association_max: 0.90                # Cramér's V or η of a pair with a categorical member

training:
  path: automl                           # FLAML, the only path in Phase 2
  estimator_list: [lgbm, xgboost, catboost]   # one entry fixes the family (D-037)
  # the trial budget: a rerun gives the same model; raise it when the metric still rises
  max_iter: null                         # null · level: autonomous 50 · assisted 200
  # an optional wall-clock cap; with it a rerun reproduces the recipe, not the model
  time_budget_s: null                    # null: no cap
  seed: 42
  search_space: {}                       # {}: FLAML's own ranges; the override format: Training
  selection:                             # automated selection by rule, on the train split only
    univariate_floor: 0.515              # drop below this univariate statistic; binary: AUC
    importance_floor: null               # null: off · drop below this importance share
  categoricals: {min_level_count: 50}    # rarer and unseen levels become __other__
  # platt: a few parameters, robust | isotonic: flexible, needs many rows | none
  calibration: {method: platt}
  sampling: null                         # null: no sampling; never on the framework's own (D-117)
  # a rare binary target, keep every positive:
  # sampling: {method: negative_downsampling, keep_fraction: 0.1, seed: 42}
  # a common target or regression, fewer clients:
  # sampling: {method: client_sample, share: 0.3, seed: 42}

evaluation:
  # metrics at the top of the ranking; either list may be empty. EDA reads them too (each key
  # feature alone at the slices), plus decision.n as a slice for a top_n decision
  slices:
    top_pct: null  # null · level: autonomous [0.01, 0.1] · assisted [0.01, 0.05, 0.1]
    top_n: []                            # e.g. [10000]
  views: []                              # extended views to add; the core views always render

lifecycle:
  promotion_gate: {min: null}            # null: no minimum until the stage is built

inference:
  model: production                      # production | a registered run_id, to pin one version

monitoring:
  drift: {psi_max: 0.25}                 # PSI above it flags a feature or the score
  outcome_join: true                     # join matured labels to the scores (D-054)
  # "retrain recommended" after this age or this many flags
  retrain_policy: {max_age_months: null, psi_flags: null}   # null: not set
