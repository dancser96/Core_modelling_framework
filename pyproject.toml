[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-modelling"
description = "Config-driven modelling framework: governed, reusable ML lifecycle for use cases."
requires-python = ">=3.11"   # develop on 3.11 for bank parity (see docs/context/environment.md)
dynamic = ["version"]
# Compatible ranges for consumers of the package. Exact bank-parity pins live in requirements.txt.
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=2.2,<3",
    "pyarrow>=19",
    "pyspark>=3.4,<4",
    "scikit-learn>=1.8,<2",
    "lightgbm>=4.6,<5",
    "catboost>=1.2,<2",
    "xgboost>=3.2,<4",
    "flaml>=2.7,<3",
    "shap>=0.50",
    "pydantic>=2.12,<3",
    "pyyaml>=6",
    "matplotlib>=3.10,<4",
]

[tool.setuptools.dynamic]
version = { attr = "core_modelling.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
